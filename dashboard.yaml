# the one exception). `internal: true` just hides them from the ESPHome API
# entity list since they only exist to feed the display lambda.
sensor:
  # --- Indoor / outdoor temperatures ---
  - platform: homeassistant
    id: temp_downstairs
    entity_id: sensor.downstairs_current_temperature
    internal: true
  - platform: homeassistant
    id: temp_upstairs

# =============================================================================
# ESPHome + Home Assistant E-Paper Dashboard
# -----------------------------------------------------------------------------
# Runs on a Seeed Studio XIAO 7.5" ePaper Panel (XIAO ESP32-C3 + 800x480
# e-paper). Sensor/service state is pulled from Home Assistant over the
# native API and rendered by hand in the `display:` lambda at the bottom of
# this file - there's no Lovelace card involved, every box/line/icon below
# is drawn at fixed pixel coordinates.
#
# See README.md for the wiring reference, a diagram of how the two screens
# are chosen, and a step-by-step guide for adding your own sensors/rows.
# =============================================================================

# --- Quick customization knobs ----------------------------------------------
# Change these instead of hunting through the lambda below for the things
# most people want to tweak first. Everything else (sensor entity IDs, box
# layout) is specific to my setup and documented in the README instead.
substitutions:
  device_name: ha-dashboard
  friendly_name: "HA Dashboard"
  location_name: "South Queensferry"    # Shown in the top-left box on the home screen
  refresh_interval: 1800s               # How often the display redraws and flips between the home/Proxmox screens
  splash_duration: 10s                  # How long the boot splash is shown before switching to the home screen
  proxmox_row_height: "32"              # Vertical spacing (px) between rows in the Proxmox table
  service_row_height: "40"              # Vertical spacing (px) between rows in the Service Status box

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -10.0 # Run after the network and API have connected
    then:
      - script.execute: show_splash_screen

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# Logging & OTA
logger:

api:
  encryption:
    key: "[Key generated when setting up the app]"

ota:
  - platform: esphome
    password: "[Password generated when setting it up]"

wifi:
  ssid: !secret wifi_ssid  #THIS IS SAVED ON ESP32 Portal
  password: !secret wifi_password
  ap:
    ssid: "HA-Dashboard Fallback"
    password: "fallbackpassword"

captive_portal:

# -----------------------------------------------------------------------------
# Fonts
# -----------------------------------------------------------------------------
# ESPHome ships a subset-only font renderer: every MDI glyph used anywhere in
# the lambda MUST be listed under `glyphs:` for that font or it will render
# as a blank box. If you add a new icon, add its codepoint here too - look it
# up by name at https://pictogrammers.com/library/mdi/ (the site shows the
# codepoint as e.g. F0599; prefix it with "000" and \U to get \U000F0599).
font:
  - file: "gfonts://Inter@700"
    id: myFont       # Headings / large labels
    size: 24

  - file: "gfonts://Inter@700"
    id: myFonts      # Body text / table rows
    size: 20

  - file: "gfonts://Inter@700"
    id: fontFooter   # Small status footer text (home screen only)
    size: 14

  - file: 'fonts/materialdesignicons-webfont.ttf'
    id: font_mdi_medium
    size: 40
    glyphs: &mdi-glyphs
      - "\U000F050F"  # thermometer
      - "\U000F048D"  # server-network
      - "\U000F05E0"  # check-circle
      - "\U000F0159"  # close-circle
      - "\U000F02DC"  # home
      - "\U000F035B"  # memory
      - "\U000F02CA"  # disk
      - "\U000F061A"  # cpu
      - "\U000F0906"  # running
      # Weather condition icons (see the `weather_icon` lambda helper below)
      - "\U000F0599"  # weather-sunny
      - "\U000F0594"  # weather-night (clear-night)
      - "\U000F0595"  # weather-partly-cloudy
      - "\U000F0590"  # weather-cloudy
      - "\U000F0591"  # weather-fog (also used for "hazy")
      - "\U000F0597"  # weather-rainy
      - "\U000F0596"  # weather-pouring
      - "\U000F0593"  # weather-lightning
      - "\U000F067E"  # weather-lightning-rainy
      - "\U000F0598"  # weather-snowy
      - "\U000F067F"  # weather-snowy-rainy
      - "\U000F0592"  # weather-hail
      - "\U000F059D"  # weather-windy
      - "\U000F059E"  # weather-windy-variant
      - "\U000F0028"  # alert-circle (fallback for an unrecognised condition)

  # Small icon set used in the status footer (home screen) and the Proxmox
  # table's per-row status column - sized to sit inline with 18-20px text
  # instead of the 40px icons above.
  - file: 'fonts/materialdesignicons-webfont.ttf'
    id: font_mdi_small
    size: 18
    glyphs:
      - "\U000F05E0"  # check-circle - container/service running
      - "\U000F0159"  # close-circle - container/service stopped
      - "\U000F0150"  # clock-outline - last-updated timestamp
      - "\U000F05A9"  # wifi - Home Assistant API connected
      - "\U000F05AA"  # wifi-off - Home Assistant API disconnected
      - "\U000F0028"  # alert-circle - paired with wifi-off

# Images
image:
  - file: /config/esphome/image/proxmox.jpg
    id: myImage
    type: BINARY
    resize: 800x480
    invert_alpha: true

# SPI bus for the display. These pins are wired internally on the XIAO
# 7.5" ePaper Panel - you only need to change them if you're driving a
# waveshare panel from a different/bare ESP32 board.
spi:
  clk_pin: GPIO8
  mosi_pin: GPIO10

